services:
  - type: web
    name: runtime-backend
    runtime: python
    plan: standard
    region: singapore
    branch: iteration-5-demo
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: python manage.py migrate --noinput && gunicorn backend.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: DATABASE_URL
        fromDatabase:
          name: runtime-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ""
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: TMAP_APP_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase.json
      - key: STREET_GRAPH_URL
        value: https://github.com/snuhcs-course/swpp-2026-project-team-16/releases/download/street-graph-v2/seoul_walk.pkl.gz
      - key: STREET_GRAPH_SHA256
        value: 704e635708abf4589ace1ae13cf2c63487f268747214f9d48fd77e5468cf81e6

databases:
  - name: runtime-db
    plan: free
    region: singapore
    databaseName: runtime
    user: runtime
