services:
  - type: web
    name: runtime-backend
    runtime: python
    plan: free
    region: singapore
    branch: iteration-4-demo
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn backend.wsgi --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.2
      - key: DATABASE_URL
        fromDatabase:
          name: runtime-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ""
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TMAP_APP_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase.json

databases:
  - name: runtime-db
    plan: free
    region: singapore
    databaseName: runtime
    user: runtime
