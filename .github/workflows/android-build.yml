name: Android Build

on:
  push:
    branches:
      - iteration-3-demo
  workflow_dispatch:

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android APK
        run: ./gradlew assemble -PRUNTIME_BASE_URL=http://77.243.80.90:8080

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swpp-android-apk
          path: android_app/app/build/outputs/apk/**/*.apk
          retention-days: 14
