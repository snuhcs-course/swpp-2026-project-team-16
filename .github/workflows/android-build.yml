name: Android Build

on:
  push:
    branches:
      - iteration-3-demo
      - iteration-4-demo
  workflow_dispatch:

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: android_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Configure Gradle properties
        env:
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          test -n "$GOOGLE_WEB_CLIENT_ID" || { echo "GOOGLE_WEB_CLIENT_ID secret is missing"; exit 1; }
          mkdir -p ~/.gradle
          printf 'NAVER_MAP_CLIENT_ID=%s\n' "$NAVER_MAP_CLIENT_ID" >> ~/.gradle/gradle.properties
          printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID" >> ~/.gradle/gradle.properties

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android APK
        env:
          RUNTIME_BASE_URL: ${{ vars.RUNTIME_BASE_URL }}
        run: |
          ./gradlew assemble "-PRUNTIME_BASE_URL=${RUNTIME_BASE_URL}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: swpp-android-apk
          path: android_app/app/build/outputs/apk/**/*.apk
          retention-days: 14
